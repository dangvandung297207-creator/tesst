name: Release MegaFishing Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B -ntp clean package

      - name: Generate checksum
        run: sha256sum target/mega-fishing-tycoon-1.1.1.jar > target/mega-fishing-tycoon-1.1.1.jar.sha256

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Mega Fishing Tycoon for Paper 26.2 / Java 25.

          Highlights:
          - Full vanilla fishing replacement using the normal Fishing Rod
          - Custom boss-fight fishing loop with tension, direction, active skill, and fish phases
          - Dedicated Fishing World with zone-based world profiles and weaker casual normal-water fishing
          - Weight-scaled fish visuals, environment-locked fish generation, rods and pets with environment bonuses
          - SQLite-backed persistence with central tick gameplay and server-authoritative combat and reward flow
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            target/mega-fishing-tycoon-1.1.1.jar
            target/original-mega-fishing-tycoon-1.1.1.jar
            target/mega-fishing-tycoon-1.1.1.jar.sha256
