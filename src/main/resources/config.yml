debug: false
replace-vanilla-fishing: true

fishing:
  bite:
    min-delay: 2.0
    max-delay: 8.0
    reaction-window: 2.0
  cast:
    require-water: true
  active-skill:
    method: SWAP_HANDS
  update:
    ui-interval-ticks: 4
    raytrace-interval-ticks: 4
    line-interval-ticks: 5
    debug-log-interval-ticks: 40
  safety:
    max-session-distance: 32.0
    obstruction-grace-seconds: 3.0
    exhausted-capture-window: 2.0
    stuck-seconds: 5.0

direction:
  good-dot-max: -0.5
  neutral-dot-max: 0.5
  good:
    damage-multiplier: 1.0
    tension-multiplier: 0.75
    tension-decay-per-second: 5.0
  neutral:
    damage-multiplier: 0.75
    tension-multiplier: 1.0
    tension-decay-per-second: 1.0
  bad:
    damage-multiplier: 0.5
    tension-multiplier: 1.5
    tension-gain-per-second: 5.0

tension:
  start: 25.0
  safe-max: 60.0
  power-max: 80.0
  break-point: 100.0
  power-dps-multiplier: 2.0
  danger-warning-sound-interval-ticks: 20
  obstruction-gain-per-second: 8.0
  out-of-range-gain-per-second: 12.0
  reel-reduction: 3.0
  exhausted-decay-per-second: 12.0

fish-phases:
  NORMAL:
    speed-multiplier: 1.0
    pull-multiplier: 1.0
    turn-rate-multiplier: 1.0
  ENRAGED:
    speed-multiplier: 1.15
    pull-multiplier: 1.18
    turn-rate-multiplier: 1.15
  FRENZY:
    speed-multiplier: 1.35
    pull-multiplier: 1.40
    turn-rate-multiplier: 1.35

fish-size-tiers:
  small:
    min-progress: 0.0
    max-progress: 0.25
    chance: 50.0
    scale: 0.8
    health-multiplier: 0.85
  medium:
    min-progress: 0.25
    max-progress: 0.55
    chance: 30.0
    scale: 1.0
    health-multiplier: 1.0
  large:
    min-progress: 0.55
    max-progress: 0.75
    chance: 15.0
    scale: 1.5
    health-multiplier: 1.15
  huge:
    min-progress: 0.75
    max-progress: 0.90
    chance: 4.0
    scale: 2.5
    health-multiplier: 1.35
  colossal:
    min-progress: 0.90
    max-progress: 0.99
    chance: 0.9
    scale: 4.0
    health-multiplier: 1.60
  titanic:
    min-progress: 0.99
    max-progress: 1.0
    chance: 0.1
    scale: 6.0
    health-multiplier: 1.90

combat:
  escape-knockback: 0.35
  skill-recoil-strength: 0.7
  state-modifiers:
    SURGE:
      tension-bonus-per-second: 5.0
      damage-multiplier: 0.80
    SHAKE:
      tension-bonus-per-second: 2.5
      damage-multiplier: 0.90
    DIVE:
      tension-bonus-per-second: 1.5
      damage-multiplier: 0.95

economy:
  weight-exponent: 0.94
  boss-multiplier: 1.10
  rarity-multipliers:
    COMMON: 1.0
    UNCOMMON: 1.18
    RARE: 1.55
    EPIC: 2.15
    LEGENDARY: 3.25
    MYTHICAL: 4.75
    SECRET: 7.50
  softcaps:
    veteran:
      threshold: 250000
      overflow-multiplier: 0.60
    mythic:
      threshold: 1000000
      overflow-multiplier: 0.35
    titan:
      threshold: 5000000
      overflow-multiplier: 0.20

calendar:
  timezone: system
  seasons:
    spring:
      display-name: "&aSpring Tide"
      months: [3, 4, 5]
    summer:
      display-name: "&eSummer Surge"
      months: [6, 7, 8]
    autumn:
      display-name: "&6Autumn Harvest"
      months: [9, 10, 11]
    winter:
      display-name: "&bWinter Current"
      months: [12, 1, 2]
  special-events:
    lunar_new_year:
      display-name: "&cLunar New Year"
      start: "01-20"
      end: "02-20"
    blossom_festival:
      display-name: "&dBlossom Festival"
      start: "03-15"
      end: "04-15"
    sunfest:
      display-name: "&6Sunfest"
      start: "07-01"
      end: "07-31"
    haunted_tide:
      display-name: "&5Haunted Tide"
      start: "10-01"
      end: "10-31"
    winterfest:
      display-name: "&bWinterfest"
      start: "12-01"
      end: "12-31"

rod:
  durability:
    enabled: false
    damage-on-catch: 1
    damage-on-escape: 0

bag:
  default-capacity: 10
  upgrade-costs:
    25: 15000
    50: 60000
    100: 200000
    250: 800000
    500: 3000000
    1000: 12000000
    5000: 60000000

pets:
  default-slots: 2
  slot-upgrade-costs:
    3: 35000
    4: 150000
    5: 900000
    6: 4500000

tutorial:
  enabled: true

visuals:
  fish-scale-cap: 8.0

save:
  autosave-seconds: 120
